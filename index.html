<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>项目管理工作台</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --line:#e6e8ec; --text:#131722; --sub:#697386;
    --blue:#2f5cff; --green:#12a56a; --amber:#e7a11b; --red:#e5484d;
    --radius:14px; --shadow:0 1px 2px rgba(19,23,34,.05), 0 8px 24px -12px rgba(19,23,34,.15);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 22px;background:rgba(255,255,255,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .brand{font-weight:650;font-size:16px;letter-spacing:.2px}
  .brand small{font-weight:400;color:var(--sub);margin-left:8px;font-size:12px}
  .spacer{flex:1}
  .btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:7px 14px;border-radius:10px;font-size:13.5px;cursor:pointer;transition:.15s;white-space:nowrap}
  .btn:hover{border-color:#cfd4dd;background:#fafbff}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.ghost{background:transparent}
  .btn.small{padding:4px 10px;font-size:12.5px;border-radius:8px}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .save-state{font-size:12.5px;color:var(--sub)}
  .save-state.dirty{color:var(--amber)}
  .save-state.saved{color:var(--green)}
  main{max-width:1120px;margin:0 auto;padding:22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .pad{padding:18px 20px}
  .muted{color:var(--sub)}
  .mono{font-variant-numeric:tabular-nums}

  .lock{max-width:420px;margin:9vh auto 0;text-align:center}
  .lock .card{padding:30px 26px}
  .lock h1{font-size:20px;margin:0 0 6px}
  .lock p{color:var(--sub);font-size:13.5px;margin:0 0 20px}
  .lock input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:15px;margin-bottom:12px;outline:none}
  .lock input:focus{border-color:var(--blue)}
  .lock .btn{width:100%;justify-content:center;padding:10px}
  .err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  @media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}}
  .stat{padding:16px 18px}
  .stat .k{font-size:12.5px;color:var(--sub);margin-bottom:6px}
  .stat .v{font-size:26px;font-weight:680;line-height:1.1}
  .stat .v small{font-size:13px;font-weight:400;color:var(--sub);margin-left:4px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
  .proj{padding:18px;cursor:pointer;transition:.16s;display:flex;flex-direction:column;gap:10px}
  .proj:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(19,23,34,.06),0 18px 36px -18px rgba(19,23,34,.25);border-color:#d6dbe4}
  .proj .top{display:flex;align-items:flex-start;gap:8px}
  .proj .name{font-weight:640;font-size:15.5px;flex:1;line-height:1.35}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;line-height:1.8;white-space:nowrap;border:1px solid transparent}
  .b-run{background:#eaf1ff;color:#2b4fd6;border-color:#d7e3ff}
  .b-plan{background:#f1f2f5;color:#5b6472;border-color:#e3e6ea}
  .b-done{background:#e8f7f0;color:#0f8a58;border-color:#d3f0e2}
  .b-pause{background:#fdf3e3;color:#a4700c;border-color:#f8e6c6}
  .b-p0{background:#fdecec;color:#c03237;border-color:#f8d7d8}
  .b-p1{background:#fff5e6;color:#a4700c;border-color:#f9e7c9}
  .b-p2{background:#f1f2f5;color:#5b6472;border-color:#e3e6ea}
  .b-high{background:#fdecec;color:#c03237;border-color:#f8d7d8}
  .b-mid{background:#fff5e6;color:#a4700c;border-color:#f9e7c9}
  .b-low{background:#f1f2f5;color:#5b6472;border-color:#e3e6ea}
  .bar{height:6px;background:#eceef2;border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--blue);border-radius:99px}
  .proj .meta{display:flex;gap:14px;font-size:12.5px;color:var(--sub);flex-wrap:wrap}
  .proj .last{font-size:12.5px;color:var(--sub);border-top:1px dashed var(--line);padding-top:9px;margin-top:2px}
  .proj .last b{color:var(--text);font-weight:600}

  .back{display:inline-flex;align-items:center;gap:6px;color:var(--sub);font-size:13.5px;margin-bottom:14px;cursor:pointer}
  .back:hover{color:var(--blue)}
  .dhead{padding:20px 22px;margin-bottom:14px}
  .dhead .row1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .dhead .t{font-size:19px;font-weight:660;flex:1;min-width:200px}
  .dhead .sub{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--sub);margin-top:10px}
  .cols{display:grid;grid-template-columns:1.55fr 1fr;gap:14px;align-items:start}
  @media(max-width:900px){.cols{grid-template-columns:1fr}}
  .sec{padding:18px 20px;margin-bottom:14px}
  .sec .hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .sec .hd h3{font-size:14px;font-weight:640;margin:0}
  .sec .hd .count{font-size:12px;color:var(--sub);background:#f1f2f5;padding:1px 7px;border-radius:6px}
  .sec .hd .spacer{flex:1}
  .kv{display:grid;grid-template-columns:82px 1fr;gap:8px 12px;font-size:13.5px}
  .kv .k{color:var(--sub)}
  .kv .v{white-space:pre-wrap;word-break:break-word}
  .empty{color:var(--sub);font-size:13px;padding:10px 0}

  .task{display:flex;align-items:flex-start;gap:11px;padding:10px 0;border-bottom:1px solid #f1f2f5}
  .task:last-child{border-bottom:0}
  .chk{width:19px;height:19px;border:1.5px solid #cfd5df;border-radius:6px;flex:none;margin-top:3px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
  .chk.on{background:var(--green);border-color:var(--green);color:#fff}
  .chk svg{display:none;width:12px;height:12px}
  .chk.on svg{display:block}
  .chk:hover{border-color:var(--green)}
  .task .body{flex:1;min-width:0}
  .task .ti{font-size:14px}
  .task .ti.done{color:#a0a8b5;text-decoration:line-through}
  .task .note{font-size:12.5px;color:var(--sub);margin-top:2px;white-space:pre-wrap}
  .task .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}

  .ms{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f1f2f5;font-size:13.5px}
  .ms:last-child{border-bottom:0}
  .ms .dot{width:8px;height:8px;border-radius:50%;background:#cfd5df;flex:none}
  .ms .dot.ok{background:var(--green)} .ms .dot.run{background:var(--blue)}
  .ms .nm{flex:1}
  .ms .dt{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}

  .tl{position:relative;padding-left:18px}
  .tl::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:#eceef2}
  .log{position:relative;padding:0 0 16px 0}
  .log .p{position:absolute;left:-17px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--blue);border:2px solid #fff;box-shadow:0 0 0 1px #dfe3ea}
  .log .lh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--sub)}
  .log .lt{font-size:14px;font-weight:600;margin:3px 0 4px}
  .log .ld{font-size:13px;color:#3c4453;white-space:pre-wrap}
  .log .extra{font-size:12.5px;color:var(--sub);margin-top:5px;white-space:pre-wrap}

  .risk{padding:11px 0;border-bottom:1px solid #f1f2f5;font-size:13.5px}
  .risk:last-child{border-bottom:0}
  .risk .rt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .risk .rt b{font-weight:600}
  .risk .rd{color:var(--sub);font-size:12.5px;margin-top:4px;white-space:pre-wrap}

  .rep{padding:11px 0;border-bottom:1px solid #f1f2f5;font-size:13.5px}
  .rep:last-child{border-bottom:0}
  .rep .rh{font-weight:600;margin-bottom:4px}
  .rep .rb{font-size:12.8px;color:#3c4453;white-space:pre-wrap}

  .modal-wrap{position:fixed;inset:0;background:rgba(19,23,34,.32);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
  .modal{background:#fff;border-radius:16px;width:min(620px,100%);max-height:88vh;overflow:auto;box-shadow:0 20px 60px -20px rgba(19,23,34,.4)}
  .modal .mh{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
  .modal .mh h4{margin:0;font-size:15.5px;font-weight:640;flex:1}
  .modal .mb{padding:18px 20px}
  .modal .mf{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line)}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:5px}
  .field input,.field textarea,.field select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:13.5px;outline:none;background:#fff}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue)}
  .field textarea{resize:vertical;min-height:74px}
  .field .hint{font-size:12px;color:var(--sub);margin-top:4px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#131722;color:#fff;padding:10px 18px;border-radius:10px;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:86vw}
  .toast.show{opacity:1;bottom:36px}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">项目管理工作台 <small id="hdrSub"></small></div>
  <div class="spacer"></div>
  <span id="saveState" class="save-state"></span>
  <button class="btn primary" id="btnSave" hidden>保存到云端</button>
  <button class="btn" id="btnEdit" hidden>编辑</button>
  <button class="btn ghost" id="btnSettings" hidden>设置</button>
</div>

<main id="app"></main>
<div id="modalWrap" class="modal-wrap" hidden></div>
<div class="toast" id="toast"></div>

<script>
const CFG = { owner:'chenhao020202-dotcom', repo:'pm-workbench', branch:'main', path:'data.json' };
const LKEY = { pass:'pm_pass', token:'pm_token' };

const ProjStatus = ['规划中','进行中','已完成','暂停'];
const TaskStatus = ['待开始','进行中','已完成','阻塞'];
const MsStatus   = ['未开始','进行中','已达成','延期'];
const RiskStatus = ['待处理','处理中','已关闭'];
const RiskLevel  = ['高','中','低'];
const RiskType   = ['风险','问题','依赖'];
const LogType    = ['进展','决策','阻塞','风险'];

const S = { data:null, pass:'', token:'', dirty:false, editing:false, route:{name:'home'} };

const $  = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date().toISOString().slice(0,10);
const nowStr = () => { const d=new Date(); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const uid = p => p + Math.random().toString(36).slice(2,7);

function toast(msg, ms=2200){ const el=$('#toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'), ms); }

function b64enc(u8){ let s=''; const CH=0x8000; for(let i=0;i<u8.length;i+=CH) s+=String.fromCharCode.apply(null,u8.subarray(i,i+CH)); return btoa(s); }
function b64dec(b){ const bin=atob(b); const u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i); return u8; }

async function deriveKey(pass, salt, iter){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'}, km, {name:'AES-GCM',length:256}, false, ['encrypt','decrypt']);
}
async function gunzip(u8){
  const s = new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
async function gzipBytes(u8){
  const s = new Blob([u8]).stream().pipeThrough(new CompressionStream('gzip'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
async function decryptPayload(payload, pass){
  const salt = b64dec(payload.kdf.salt), iv = b64dec(payload.iv);
  const key = await deriveKey(pass, salt, payload.kdf.iter);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM',iv}, key, b64dec(payload.ct));
  let buf = new Uint8Array(pt);
  if(payload.zip === 'gzip') buf = await gunzip(buf);
  return JSON.parse(new TextDecoder().decode(buf));
}
async function encryptData(obj, pass){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pass, salt, 100000);
  const raw = await gzipBytes(new TextEncoder().encode(JSON.stringify(obj)));
  const ctBuf = await crypto.subtle.encrypt({name:'AES-GCM',iv}, key, raw);
  return {v:1,alg:'AES-GCM',zip:'gzip',kdf:{name:'PBKDF2',hash:'SHA-256',iter:100000,salt:b64enc(salt)},iv:b64enc(iv),ct:b64enc(new Uint8Array(ctBuf))};
}

async function loadRemote(){
  const r = await fetch('./data.json?t=' + Date.now(), {cache:'no-store'});
  if(!r.ok) throw new Error('读取数据失败：' + r.status);
  return r.json();
}

function markDirty(v){
  S.dirty = v;
  const el = $('#saveState');
  el.className = 'save-state' + (v ? ' dirty' : ' saved');
  el.textContent = v ? '有未保存的修改' : '已与云端同步';
  $('#btnSave').hidden = !(v && S.token);
}

async function saveCloud(){
  if(!S.token) return toast('请先在设置里填写 GitHub Token');
  if(!S.pass) return toast('缺少访问口令');
  const btn = $('#btnSave'); btn.disabled = true; btn.textContent = '保存中…';
  try {
    S.data.meta = S.data.meta || {};
    S.data.meta.updatedAt = nowStr();
    const payload = await encryptData(S.data, S.pass);
    const contentStr = JSON.stringify(payload);
    const api = `https://api.github.com/repos/${CFG.owner}/${CFG.repo}/contents/${CFG.path}`;
    const hdr = { 'Authorization':'Bearer ' + S.token, 'Accept':'application/vnd.github+json' };
    let sha = null;
    const g = await fetch(api + '?ref=' + CFG.branch, {headers:hdr, cache:'no-store'});
    if(g.ok){ const j = await g.json(); sha = j.sha; }
    const body = { message:'更新项目数据 ' + nowStr(), content: b64enc(new TextEncoder().encode(contentStr)), branch: CFG.branch };
    if(sha) body.sha = sha;
    const w = await fetch(api, {method:'PUT', headers:{...hdr,'Content-Type':'application/json'}, body:JSON.stringify(body)});
    if(!w.ok){ const t = await w.text(); throw new Error('提交失败 ' + w.status + ' ' + t.slice(0,120)); }
    markDirty(false);
    toast('已提交到云端，约 1 分钟后生效');
    render();
  } catch(e){ toast('保存失败：' + e.message, 4000); }
  finally { btn.disabled=false; btn.textContent='保存到云端'; }
}

function render(){
  const app = $('#app');
  const ed = $('#btnEdit'), st = $('#btnSettings'), hdr = $('#hdrSub');
  if(!S.data){ ed.hidden = true; st.hidden = true; hdr.textContent=''; app.innerHTML = lockHTML(); return; }
  if(!S.token) S.editing = false;
  ed.hidden = !S.token; st.hidden = false;
  ed.textContent = S.editing ? '退出编辑' : '编辑';
  hdr.textContent = '更新于 ' + ((S.data.meta && S.data.meta.updatedAt) || '—');
  if(S.route.name === 'detail'){
    const p = getProj(S.route.pid);
    app.innerHTML = p ? detailHTML(p) : '<div class="empty">项目不存在</div>';
  } else {
    app.innerHTML = homeHTML();
  }
  markDirty(S.dirty);
}

function lockHTML(){
  return `<div class="lock"><div class="card">
    <h1>项目管理工作台</h1>
    <p>输入访问口令查看项目与进展</p>
    <input id="passIn" type="password" placeholder="访问口令" autocomplete="current-password">
    <button class="btn primary" id="btnUnlock">进入</button>
    <div class="err" id="lockErr"></div>
  </div></div>`;
}

function stBadge(s){
  const m = {'进行中':'b-run','规划中':'b-plan','已完成':'b-done','暂停':'b-pause'}[s] || 'b-plan';
  return `<span class="badge ${m}">${esc(s)}</span>`;
}
function prBadge(p){
  const m = {'P0':'b-p0','P1':'b-p1','P2':'b-p2'}[p] || 'b-p2';
  return p ? `<span class="badge ${m}">${esc(p)}</span>` : '';
}
function lvBadge(l){
  const m = {'高':'b-high','中':'b-mid','低':'b-low'}[l] || 'b-low';
  return `<span class="badge ${m}">${esc(l)}</span>`;
}

function getProj(id){ return (S.data.data.projects||[]).find(p=>p.id===id); }
function taskRatio(p){
  const t = p.tasks||[]; if(!t.length) return {done:0,total:0,pct:0};
  const done = t.filter(x=>x.status==='已完成').length;
  return {done,total:t.length,pct:Math.round(done/t.length*100)};
}
function openRisks(p){ return (p.risks||[]).filter(r=>r.status!=='已关闭'); }
function lastLog(p){ const l=(p.logs||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')); return l[0]; }

function homeHTML(){
  const ps = S.data.data.projects || [];
  const allTasks = ps.flatMap(p => (p.tasks||[]).map(t=>({...t, pname:p.name, pid:p.id})));
  const doneT = allTasks.filter(t=>t.status==='已完成').length;
  const runPs = ps.filter(p=>p.status==='进行中').length;
  const riskN = ps.reduce((n,p)=>n+openRisks(p).length,0);
  const pct = allTasks.length ? Math.round(doneT/allTasks.length*100) : 0;
  const doing = allTasks.filter(t=>t.status!=='已完成').sort((a,b)=>{
    const pr = x=>x.priority==='P0'?0:x.priority==='P1'?1:2; return pr(a)-pr(b);
  }).slice(0,8);

  return `
  <div class="stats">
    <div class="card stat"><div class="k">项目总数</div><div class="v">${ps.length}<small>个</small></div></div>
    <div class="card stat"><div class="k">进行中</div><div class="v">${runPs}<small>个</small></div></div>
    <div class="card stat"><div class="k">未关闭风险 / 问题</div><div class="v">${riskN}<small>项</small></div></div>
    <div class="card stat"><div class="k">任务完成率</div><div class="v">${pct}<small>% · ${doneT}/${allTasks.length}</small></div></div>
  </div>
  <div class="grid">
    ${ps.map(p=>{
      const r = taskRatio(p), ll = lastLog(p);
      return `<div class="card proj" data-act="open" data-id="${esc(p.id)}">
        <div class="top"><div class="name">${esc(p.name)}</div>${stBadge(p.status)}</div>
        <div class="meta">${prBadge(p.priority)}<span>负责人 ${esc(p.owner||'—')}</span></div>
        <div>
          <div class="bar"><i style="width:${r.pct}%"></i></div>
          <div class="meta" style="margin-top:7px"><span>任务 ${r.done}/${r.total}</span><span>风险 ${openRisks(p).length}</span><span>里程碑 ${(p.milestones||[]).length}</span></div>
        </div>
        <div class="last">${ll ? `<b>${esc(ll.date)}</b> · ${esc(ll.title)}` : '暂无进展记录'}</div>
      </div>`;
    }).join('')}
  </div>
  ${doing.length ? `<div class="card sec" style="margin-top:18px">
    <div class="hd"><h3>待推进的任务</h3><span class="count">${doing.length}</span></div>
    ${doing.map(t=>`<div class="task" data-act="open" data-id="${esc(t.pid)}" style="cursor:pointer">
      <div style="flex:1;min-width:0">
        <div class="ti">${esc(t.title)}</div>
        <div class="note">${esc(t.pname)}${t.note?' · '+esc(t.note):''}</div>
      </div>
      <div class="tags">${prBadge(t.priority)}<span class="badge b-plan">${esc(t.status)}</span></div>
    </div>`).join('')}
  </div>` : ''}`;
}

function detailHTML(p){
  const r = taskRatio(p);
  return `
  <div class="back" data-act="home">← 返回项目列表</div>
  <div class="card dhead">
    <div class="row1">
      <div class="t">${esc(p.name)}</div>

    <div class="sub">
      <span>负责人 ${esc(p.owner||'—')}</span>

      <div class="card sec">

          <div class="k">项目简介</div><div class="v">${esc(p.summary||'待补充')}</div>
          <div class="k">干系人</div><div class="v">${esc(p.stakeholders||'待补充')}</div>
        </div>
      </div>

      <div class="card sec">
        <div class="hd"><h3>任务</h3><span class="count">${r.done}/${r.total}</span><div class="spacer"></div>
          ${S.editing ? `<button class="btn small" data-act="addTask">+ 新增任务</button>` : ''}</div>
        ${(p.tasks||[]).length ? (p.tasks||[]).map(t=>`
          <div class="task">
            <div class="chk ${t.status==='已完成'?'on':''}" ${S.editing?`data-act="toggleTask" data-tid="${esc(t.id)}"`:''}>
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M2.5 8.5l3.5 3.5 7-8"/></svg>
            </div>
            <div class="body">
              <div class="ti ${t.status==='已完成'?'done':''}">${esc(t.title)}</div>
              ${t.note?`<div class="note">${esc(t.note)}</div>`:''}
              <div class="tags">${prBadge(t.priority)}<span class="badge b-plan">${esc(t.status)}</span>${t.due?`<span class="badge b-plan">截止 ${esc(t.due)}</span>`:''}</div>
            </div>
            ${S.editing?`<button class="btn small ghost" data-act="editTask" data-tid="${esc(t.id)}">改</button>`:''}
          </div>`).join('') : '<div class="empty">暂无任务</div>'}
      </div>

      <div class="card sec">
        <div class="hd"><h3>进展记录</h3><span class="count">${(p.logs||[]).length}</span><div class="spacer"></div>
          ${S.editing ? `<button class="btn small" data-act="addLog">+ 记一条</button>` : ''}</div>
        ${(p.logs||[]).length ? `<div class="tl">${(p.logs||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(l=>`
          <div class="log">
            <div class="p"></div>
            <div class="lh"><span class="mono">${esc(l.date||'')}</span><span class="badge b-plan">${esc(l.type||'进展')}</span></div>
            <div class="lt">${esc(l.title)}</div>
            ${l.detail?`<div class="ld">${esc(l.detail)}</div>`:''}
            ${l.blocker?`<div class="extra">阻塞：${esc(l.blocker)}</div>`:''}
            ${l.next?`<div class="extra">下一步：${esc(l.next)}</div>`:''}
          </div>`).join('')}</div>` : '<div class="empty">暂无进展</div>'}
      </div>
    </div>

    <div>
      <div class="card sec">
        <div class="hd"><h3>里程碑</h3><div class="spacer"></div>
          ${S.editing ? `<button class="btn small" data-act="addMs">+ 新增</button>` : ''}</div>
        ${(p.milestones||[]).length ? (p.milestones||[]).map(m=>`
          <div class="ms">
            <div class="dot ${m.status==='已达成'?'ok':m.status==='进行中'?'run':''}"></div>
            <div class="nm">${esc(m.name)}</div>
            <div class="dt">${esc(m.actualDate||m.planDate||'—')}</div>
          </div>`).join('') : '<div class="empty">暂无里程碑</div>'}
      </div>

      <div class="card sec">
        <div class="hd"><h3>风险与问题</h3><span class="count">${openRisks(p).length}</span><div class="spacer"></div>
          ${S.editing ? `<button class="btn small" data-act="addRisk">+ 新增</button>` : ''}</div>
        ${(p.risks||[]).length ? (p.risks||[]).map(x=>`
          <div class="risk">
            <div class="rt">${lvBadge(x.level)}<b>${esc(x.title)}</b><span class="badge b-plan">${esc(x.status)}</span></div>
            <div class="rd">${x.impact?'影响：'+esc(x.impact):''}${x.impact&&x.action?'\n':''}${x.action?'措施：'+esc(x.action):''}</div>

        ${(p.reports||[]).length ? (p.reports||[]).slice().sort((a,b)=>(b.weekStart||'').localeCompare(a.weekStart||'')).map(w=>`
          <div class="rep">

            <div class="rb">${w.progress?'进展：\n'+esc(w.progress)+'\n':''}${w.plan?'下周：\n'+esc(w.plan)+'\n':''}${w.risk?'风险：\n'+esc(w.risk):''}</div>
          </div>`).join('') : '<div class="empty">暂无周报</div>'}

function openModal(title, fields, onSubmit){
  const wrap = $('#modalWrap');
  wrap.hidden = false;
  wrap.innerHTML = `<div class="modal">
    <div class="mh"><h4>${esc(title)}</h4><button class="btn small ghost" data-act="closeModal">关闭</button></div>
    <div class="mb">${fields.map((f,i)=>{
      const id = 'f'+i;
      const v = f.value==null?'':String(f.value);
      if(f.type==='select'){
        return `<div class="field"><label>${esc(f.label)}</label><select id="${id}">${(f.options||[]).map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
      }
      if(f.type==='textarea'){
        return `<div class="field"><label>${esc(f.label)}</label><textarea id="${id}" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea></div>`;
      }
      return `<div class="field"><label>${esc(f.label)}</label><input id="${id}" type="${f.type||'text'}" value="${esc(v)}" placeholder="${esc(f.ph||'')}">${f.hint?`<div class="hint">${esc(f.hint)}</div>`:''}</div>`;
    }).join('')}</div>
    <div class="mf"><button class="btn" data-act="closeModal">取消</button><button class="btn primary" id="modalOk">保存</button></div>
  </div>`;
  $('#modalOk').onclick = () => {
    const vals = fields.map((f,i)=>{ const el=$('#f'+i); return el ? el.value.trim() : ''; });
    const obj = {}; fields.forEach((f,i)=>obj[f.k]=vals[i]);
    if(onSubmit(obj) !== false) closeModal();
  };
}
function closeModal(){ const w=$('#modalWrap'); w.hidden=true; w.innerHTML=''; }

function openSettings(){
  openModal('设置', [
    {k:'token', label:'GitHub Token（只有填了才能保存改动，访客不用填）', type:'text', value:S.token, ph:'ghp_... 或 github_pat_...', hint:'在 GitHub → Settings → Developer settings → Personal access tokens 生成，勾选 repo 权限。只存在本机浏览器里。'},
    {k:'pass', label:'访问口令（用于加密数据，改成新的会让旧口令失效）', type:'text', value:S.pass, ph:'chenhao-pm-2026'}
  ], (o)=>{
    if(o.token) localStorage.setItem(LKEY.token, o.token); else localStorage.removeItem(LKEY.token);
    S.token = o.token || '';
    if(o.pass && o.pass !== S.pass){
      S.pass = o.pass; localStorage.setItem(LKEY.pass, o.pass);
      toast('口令已改，要点保存到云端才会生效', 3500);
      markDirty(true);
    }
    render();
  });
}

function curProj(){ return getProj(S.route.pid); }

function toggleTask(tid){
  const p = curProj(); if(!p) return;
  const t = (p.tasks||[]).find(x=>x.id===tid); if(!t) return;
  if(t.status==='已完成'){ t.status='进行中'; delete t.doneDate; }
  else { t.status='已完成'; t.doneDate = today(); }
  markDirty(true); render();
}

function editTask(tid){
  const p = curProj(); const t = (p.tasks||[]).find(x=>x.id===tid); if(!t) return;
  openModal('编辑任务', [
    {k:'title',label:'任务',value:t.title},
    {k:'status',label:'状态',type:'select',options:TaskStatus,value:t.status},
    {k:'priority',label:'优先级',type:'select',options:['P0','P1','P2'],value:t.priority||'P1'},
    {k:'due',label:'截止',type:'date',value:t.due},
    {k:'note',label:'备注',type:'textarea',value:t.note}
  ],(o)=>{ Object.assign(t,o); if(t.status==='已完成'&&!t.doneDate)t.doneDate=today(); markDirty(true); render(); });
}

function addTask(){
  const p = curProj(); if(!p) return;
  openModal('新增任务', [
    {k:'title',label:'任务',ph:'要做的事'},
    {k:'status',label:'状态',type:'select',options:TaskStatus,value:'待开始'},
    {k:'priority',label:'优先级',type:'select',options:['P0','P1','P2'],value:'P1'},
    {k:'due',label:'截止',type:'date'},
    {k:'note',label:'备注',type:'textarea'}
  ],(o)=>{
    if(!o.title){ toast('任务名不能空'); return false; }
    p.tasks = p.tasks || [];
    p.tasks.push({id:uid('t'), ...o}); markDirty(true); render();
  });
}

function addLog(){
  const p = curProj(); if(!p) return;
  openModal('记一条进展', [
    {k:'date',label:'日期',type:'date',value:today()},
    {k:'type',label:'类型',type:'select',options:LogType,value:'进展'},
    {k:'title',label:'标题',ph:'一句话概括'},
    {k:'detail',label:'详情',type:'textarea',ph:'做了什么、结论是什么'},
    {k:'blocker',label:'阻塞（可选）',type:'text'},
    {k:'next',label:'下一步',type:'text'}
  ],(o)=>{
    if(!o.title){ toast('标题不能空'); return false; }
    p.logs = p.logs || [];
    p.logs.push({id:uid('l'), ...o}); markDirty(true); render();
  });
}

function addMs(){
  const p = curProj(); if(!p) return;
  openModal('新增里程碑', [
    {k:'name',label:'名称',ph:'阶段节点'},
    {k:'status',label:'状态',type:'select',options:MsStatus,value:'未开始'},
    {k:'planDate',label:'计划日期',type:'date'},
    {k:'actualDate',label:'实际达成',type:'date'}
  ],(o)=>{
    if(!o.name){ toast('名称不能空'); return false; }
    p.milestones = p.milestones || [];
    p.milestones.push({id:uid('m'), ...o}); markDirty(true); render();
  });
}

function addRisk(){
  const p = curProj(); if(!p) return;
  openModal('新增风险 / 问题', [
    {k:'title',label:'标题',ph:'风险或问题是什么'},
    {k:'type',label:'类型',type:'select',options:RiskType,value:'风险'},
    {k:'level',label:'等级',type:'select',options:RiskLevel,value:'中'},
    {k:'status',label:'状态',type:'select',options:RiskStatus,value:'待处理'},
    {k:'impact',label:'影响',type:'textarea'},
    {k:'action',label:'应对措施',type:'textarea'}
  ],(o)=>{
    if(!o.title){ toast('标题不能空'); return false; }
    p.risks = p.risks || [];
    p.risks.push({id:uid('r'), owner:p.owner||'', targetDate:'', ...o}); markDirty(true); render();
  });
}

function addRep(){
  const p = curProj(); if(!p) return;
  openModal('新增周报', [
    {k:'weekStart',label:'周起始日',type:'date',value:today()},
    {k:'title',label:'标题',ph:'第 N 周周报'},
    {k:'progress',label:'本周进展',type:'textarea'},
    {k:'plan',label:'下周计划',type:'textarea'},
    {k:'risk',label:'风险',type:'textarea'}
  ],(o)=>{
    if(!o.title) o.title = '周报 ' + o.weekStart;
    p.reports = p.reports || [];
    p.reports.push({id:uid('w'), ...o}); markDirty(true); render();
  });
}

function editProj(){
  const p = curProj(); if(!p) return;
  openModal('编辑项目信息', [
    {k:'name',label:'项目名称',value:p.name},
    {k:'status',label:'状态',type:'select',options:ProjStatus,value:p.status},
    {k:'priority',label:'优先级',type:'select',options:['P0','P1','P2'],value:p.priority||'P1'},
    {k:'owner',label:'负责人',value:p.owner},
    {k:'start',label:'开始日期',type:'date',value:p.start},
    {k:'end',label:'计划结束',type:'date',value:p.end},
    {k:'goal',label:'项目目标',type:'textarea',value:p.goal},
    {k:'keyResults',label:'关键成果',type:'textarea',value:p.keyResults},
    {k:'summary',label:'项目简介',type:'textarea',value:p.summary},
    {k:'stakeholders',label:'干系人与分工',type:'textarea',value:p.stakeholders}
  ],(o)=>{ Object.assign(p,o); markDirty(true); render(); });
}

document.addEventListener('click', (e)=>{
  const a = e.target.closest('[data-act]');
  if(a){
    const act = a.dataset.act;
    if(act==='open'){ S.route={name:'detail', pid:a.dataset.id}; location.hash = '#/p/'+a.dataset.id; render(); return; }
    if(act==='home'){ S.route={name:'home'}; history.replaceState(null,'',location.pathname); render(); return; }
    if(act==='toggleTask'){ toggleTask(a.dataset.tid); return; }
    if(act==='editTask'){ editTask(a.dataset.tid); return; }
    if(act==='addTask'){ addTask(); return; }
    if(act==='addLog'){ addLog(); return; }
    if(act==='addMs'){ addMs(); return; }
    if(act==='addRisk'){ addRisk(); return; }
    if(act==='addRep'){ addRep(); return; }
    if(act==='editProj'){ editProj(); return; }
    if(act==='closeModal'){ closeModal(); return; }
    return;
  }
  if(e.target.id==='btnUnlock'){ unlock(); }
});

$('#btnSave').onclick = saveCloud;
$('#btnEdit').onclick = ()=>{ S.editing = !S.editing; if(!S.editing && S.dirty) toast('还有未保存的修改'); render(); };
$('#btnSettings').onclick = openSettings;

document.addEventListener('keydown',(e)=>{
  if(e.key==='Escape') closeModal();
  if(e.key==='Enter' && document.activeElement && document.activeElement.id==='passIn') unlock();
});

async function unlock(){
  const pass = ($('#passIn').value || '').trim();
  const err = $('#lockErr');
  if(!pass){ err.textContent='请输入口令'; return; }
  err.textContent='解密中…';
  try {
    const payload = await loadRemote();
    const obj = await decryptPayload(payload, pass);
    S.data = obj; S.pass = pass;
    localStorage.setItem(LKEY.pass, pass);
    routeFromHash();
    render();
  } catch(ex){ err.textContent = '口令不正确，或数据读取失败'; }
}

function routeFromHash(){
  const h = location.hash || '';
  const m = h.match(/#\/p\/(.+)/);
  if(m && S.data && getProj(m[1])) S.route = {name:'detail', pid:m[1]};
  else S.route = {name:'home'};
}

(async function boot(){
  S.token = localStorage.getItem(LKEY.token) || '';
  render();
  const savedPass = localStorage.getItem(LKEY.pass);
  if(savedPass){
    if($('#passIn')) $('#passIn').value = savedPass;
    try {
      const payload = await loadRemote();
      S.data = await decryptPayload(payload, savedPass);
      S.pass = savedPass;
      routeFromHash();
      render();
    } catch(e){ render(); }
  }
})();

window.addEventListener('hashchange', ()=>{ if(S.data){ routeFromHash(); render(); } });
</script>
